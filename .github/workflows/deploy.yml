name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
      - name: 설정값 확인
        run: |
          if [ -z "${{ vars.SUPABASE_URL }}" ] || [ -z "${{ vars.SUPABASE_KEY }}" ]; then
            echo "::error::Settings → Secrets and variables → Actions → Variables 에 SUPABASE_URL / SUPABASE_KEY 를 등록하세요"
            exit 1
          fi
      # 안드로이드 앱이 받아 가는 화면 묶음 (앱을 다시 설치하지 않아도 화면이 업데이트됨)
      - name: 앱용 화면 묶음
        run: |
          export VITE_APP_BUNDLE="${GITHUB_SHA::12}"
          npm run build:app
          OWNER=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          PAGES="https://${OWNER}.github.io/${{ github.event.repository.name }}"
          mkdir -p dist/app
          (cd dist-app && zip -qr "../dist/app/bundle-${VITE_APP_BUNDLE}.zip" .)
          MIN=$(node -p "require('./app-version.json').min_native_api")
          cat > dist/app/version.json <<JSON
          {"version":"${VITE_APP_BUNDLE}","url":"${PAGES}/app/bundle-${VITE_APP_BUNDLE}.zip","min_native_api":${MIN},"apk":"https://github.com/${{ github.repository }}/releases/latest/download/seojae.apk"}
          JSON
          cat dist/app/version.json
        env:
          VITE_BASE: /
          VITE_APP: '1'
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
