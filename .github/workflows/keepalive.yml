name: Supabase keepalive

# 무료 Supabase 프로젝트는 7일 무활동 시 일시정지 → 3일마다 ping()
# 공개 저장소의 예약 workflow 는 60일 무활동 시 꺼짐 → 같은 실행에서 .keepalive 커밋
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase ping
        run: |
          code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST \
            "${{ vars.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ vars.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code: $(cat /tmp/out)"
          test "$code" = "200"

      - uses: actions/checkout@v4
      - name: 저장소 활동 유지
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .keepalive
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keepalive [skip ci]" || exit 0
          git push
