<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F4F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15171A" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <title>서재</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="서재">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;700&display=swap">
  <link rel="stylesheet" href="/src/styles/app.css">
  <script>
    // 첫 화면 깜빡임 방지: 저장된 화면 모드를 그리기 전에 적용
    try {
      var m = localStorage.getItem('ui:mode') || 'auto';
      if (m !== 'auto') document.documentElement.dataset.theme = m;
      var dark = m === 'dark' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.style.background = dark ? '#15171A' : '#F5F4F0';
    } catch (e) {}
    // 안드로이드에 설치한 앱: 하단 시스템 바 위에서 화면 아래 모서리를 둥글게 (app.css .android-chin)
    if (/Android/.test(navigator.userAgent)) document.documentElement.classList.add('android');
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
